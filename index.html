<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>骰命赌局</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app">
    <main class="cabinet" id="cabinet">
      <section class="screen title-screen active" id="screen-title">
        <div class="title-card">
          <div class="kicker">Trigger Chain Run</div>
          <h1 class="title-logo">骰命赌局</h1>
          <p class="title-copy">每回合掷 5 枚骰子。锁住想保留的骰面，决定现在结算触发，还是继续重掷把连锁做大。</p>
          <div class="title-tags">
            <span class="title-tag">5 场战斗</span>
            <span class="title-tag">锁骰重掷</span>
            <span class="title-tag">战后 3 选 1</span>
          </div>
          <button class="primary-launch" id="start-run-btn" type="button">开始这一局</button>
          <div class="title-foot">首次进入提示：点击骰子可锁定，再次点击取消。</div>
        </div>
      </section>

      <section class="screen battle-screen" id="screen-battle"></section>

      <section class="screen shop-screen" id="screen-shop">
        <div class="shop-card">
          <div class="kicker">战后选择</div>
          <h2 class="shop-title">强化选择</h2>
          <p class="shop-copy" id="shop-copy">拿 1 个奖励，准备下一战。</p>
          <div class="shop-grid" id="shop-grid"></div>
        </div>
      </section>

      <section class="screen summary-screen" id="screen-summary">
        <div class="summary-card">
          <div class="kicker" id="summary-kicker">结算</div>
          <h2 class="summary-title" id="summary-title">这一局结束</h2>
          <p class="summary-copy" id="summary-copy"></p>
          <div class="summary-grid" id="summary-grid"></div>
          <div class="summary-list" id="summary-list"></div>
          <button class="secondary-launch" id="play-again-btn" type="button">再开一局</button>
        </div>
      </section>
    </main>
  </div>

  <div class="damage-float" id="damage-float"></div>
  <script src="./app.js"></script>
</body>
</html>
