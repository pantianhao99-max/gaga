<body>

          <div class="title-tags">
            <span class="title-tag">5 &#x9ab0;&#x7ec4;&#x5408;</span>
            <span class="title-tag">&#x7ee7;&#x7eed;&#x91cd;&#x63b7;&#x6295;&#x62e9;</span>
            <span class="title-tag">&#x5546;&#x5e97; 3 &#x9009; 1</span>

        </div>
      </section>

      <section class="screen battle-screen" id="screen-battle"></section>

      <section class="screen shop-screen" id="screen-shop">
        <div class="shop-card">
          <div class="kicker">&#x6218;&#x540e;&#x5546;&#x5e97;</div>
          <h2 class="shop-title">&#x9009;&#x62e9;&#x4e00;&#x4e2a;&#x5f3a;&#x5316;</h2>
          <p class="shop-copy" id="shop-copy">&#x6bcf;&#x6b21;&#x53ea;&#x80fd;&#x62ff; 1 &#x4e2a;&#xff0c;&#x628a;&#x8fd9;&#x5c40;&#x5f80;&#x66f4;&#x5f3a;&#x7684;&#x7ec4;&#x5408;&#x65b9;&#x5411;&#x63a8;&#x3002;</p>

      <section class="screen summary-screen" id="screen-summary">
        <div class="summary-card">
          <div class="kicker" id="summary-kicker">&#x672c;&#x5c40;&#x603b;&#x7ed3;</div>
          <h2 class="summary-title" id="summary-title">&#x8d4c;&#x684c;&#x5df2;&#x6e05;&#x573a;</h2>
          <p class="summary-copy" id="summary-copy"></p>
          <div class="summary-grid" id="summary-grid"></div>
          <div class="summary-list" id="summary-list"></div>
          <button class="secondary-launch" id="play-again-btn" type="button">&#x518d;&#x6765;&#x4e00;&#x5c40;</button>
        </div>
      </section>
    </main>
  </div>

  <div class="damage-float" id="damage-float"></div>

  <script src="./app.js"></script>

</html>
